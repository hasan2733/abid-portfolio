# Copy to application.properties and fill in values (or use environment variables).

server.port=8080

# Firebase
portfolio.firebase.credentials-path=/absolute/path/to/firebase-service-account.json
portfolio.firebase.enabled=false

# SMTP (Gmail example: use App Password, not account password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your.email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

portfolio.notify-email=your.email@gmail.com
portfolio.mail.enabled=false
portfolio.mail.from=your.email@gmail.com

portfolio.contact.rate-limit-per-hour=5
