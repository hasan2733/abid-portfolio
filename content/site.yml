about:
  p1: I am a fourth-year Computer Science and Engineering undergraduate at
    Southeast University and a recipient of a 100% merit-based scholarship. I
    have developed a strong foundation in C++, Data Structures, and Algorithms,
    which drives my interest in Artificial Intelligence, Machine Learning, and
    solving complex computational problems.
  p2: My project experience spans software development, embedded systems, and
    AI/ML. I have built applications such as a Movie Ticket Management System
    using JavaFX, an Android-based BMI & BMR Calculator integrated with
    Firebase, andSafeTrail, an ESP32-based embedded safety system featuring GPS
    tracking, motion sensing, and geofencing. Additionally, I have completed
    several beginner-to-intermediate Machine Learning and Deep Learning projects
    and participated in on-site competitive programming contests, further
    strengthening my practical skills and problem-solving abilities.
  p3: Currently, I am specializing in Artificial Intelligence and Deep Learning,
    with hands-on experience in machine learning algorithms, neural network
    architectures, and frameworks such as TensorFlow and PyTorch. I am also
    working on my undergraduate thesis, exploring advanced AI/ML techniques,
    privacy-preserving learning, and real-world applications of deep learning.
    My goal is to pursue a career in AI/ML research, contribute to meaningful
    innovations, and develop intelligent systems that address real-world
    challenges.
