about:
  p1: "I am a third-year Computer Science and Engineering undergraduate at Southeast University and a 100% merit-based scholarship recipient. I have developed a strong foundation in C++, Data Structures, and Algorithms, which fuels my passion for software engineering and technical problem-solving."
  p2: "My experience includes building versatile applications, such as a Movie Ticket Management System using JavaFX and a BMI & BMR Calculator for Android integrated with Firebase. I am proficient in Java, Python, and SQL, and I enjoy creating well-structured software that bridge the gap between complex backend logic and user-friendly interfaces."
  p3: "Currently, I am specializing in Artificial Intelligence and Deep Learning, with hands-on experience in neural network architectures like ANN, CNN, and RNN. My goal is to contribute to AI research and build intelligent systems that solve real-world challenges through continuous learning and collaboration. My main goal is to secure a internship in the field of AI/ML."

